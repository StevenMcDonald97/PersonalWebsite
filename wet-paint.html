<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paint Drops</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --ground:      #232A34;
  --ground-deep: #1A2029;
  --linen:       #EFEAE0;
  --linen-mute:  #A2AEBB;

  --mono: "JetBrains Mono", ui-monospace, monospace;
  --gutter: clamp(1rem, 4vw, 2.75rem);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; height:100%; }

body{
  margin:0;
  height:100%;
  background:var(--ground);
  color:var(--linen);
  font-family:var(--mono);
  line-height:1.5;
  overflow:hidden;                       /* the board is the whole page; nothing should scroll */
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;              /* no pull-to-refresh mid-dodge on mobile */
}

/* ─── BOARD ─────────────────────────────────────────── */
.board{
  position:relative;
  width:100%; height:100svh;
  overflow:hidden;
  isolation:isolate;
  cursor:none;                           /* the linen dot IS the cursor */
  touch-action:none;                     /* let pointermove drive the game instead of scrolling */
}
.board.idle{ cursor:default; }

#paint{ position:absolute; inset:0; z-index:-1; width:100%; height:100%; display:block; }

/* Static lighting: highlight top-left, vignette at the foot. */
.board::after{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(120% 90% at 12% 0%, rgba(255,255,255,.055), transparent 62%),
    linear-gradient(180deg, transparent 55%, rgba(20,25,32,.55) 100%);
}

/* ─── HUD ───────────────────────────────────────────── */
/* Two corners only. Everything is mono, so the numbers sit on a
   fixed grid and never reflow as digits change. */
.hud{
  position:absolute; inset:var(--gutter) var(--gutter) auto;
  display:flex; justify-content:space-between; align-items:flex-start;
  pointer-events:none;
  opacity:0; transition:opacity .45s ease;
}
.hud.live{ opacity:1; }

.stat{ display:flex; flex-direction:column; gap:.15rem; }
.stat.right{ align-items:flex-end; text-align:right; }

.stat .label{
  font-size:.6rem; font-weight:500; letter-spacing:.16em;
  text-transform:uppercase; color:var(--linen-mute); opacity:.7;
}
.stat .value{
  font-size:clamp(1.75rem, 6vw, 3rem); font-weight:700;
  letter-spacing:-.04em; line-height:1;
  font-variant-numeric:tabular-nums;
}
.stat .sub{
  font-size:.68rem; color:var(--linen-mute); letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}

/* Score flash: the time readout kicks to whichever pigment just got wiped. */
.stat .value.flash{ animation:kick .34s ease-out; }
@keyframes kick{ 0%{ transform:scale(1.08); } 100%{ transform:scale(1); } }

/* ─── PAINT GAUGE ───────────────────────────────────── */
/* Bottom-centre, deliberately small: it should be readable in
   peripheral vision without ever pulling your eye off the board. */
.gauge{
  position:absolute; left:50%; bottom:var(--gutter);
  transform:translateX(-50%);
  width:min(46vw, 280px);
  pointer-events:none;
  opacity:0; transition:opacity .45s ease;
}
.gauge.live{ opacity:1; }

.gauge .glabel{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:.6rem; font-weight:500; letter-spacing:.16em;
  text-transform:uppercase; color:var(--linen-mute); opacity:.7;
  margin-bottom:.35rem;
  font-variant-numeric:tabular-nums;
  transition:color .2s ease, opacity .2s ease;
}
.gauge .track{
  height:3px; border-radius:2px; overflow:hidden;
  background:rgba(239,234,224,.13);
}
.gauge .fill{
  display:block; height:100%; width:100%;
  border-radius:2px;
  transition:background-color .25s ease;
}

/* Dry: the pot is empty and painting is locked out until it recovers. */
.gauge.dry .glabel{ color:var(--linen); opacity:1; animation:dryPulse 1s ease-in-out infinite; }
@keyframes dryPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

/* ─── CARDS (title / paused / caught) ───────────────── */
.card{
  position:absolute; inset:0; z-index:2;
  display:grid; place-content:center; justify-items:center;
  gap:.5rem; padding:var(--gutter);
  text-align:center;
  background:
    radial-gradient(60% 50% at 50% 50%, rgba(26,32,41,.82), rgba(26,32,41,.94));
  backdrop-filter:blur(2px);
  transition:opacity .3s ease;
}
.card[hidden]{ display:none; }

.card .eyebrow{
  font-size:.62rem; font-weight:500; letter-spacing:.2em;
  text-transform:uppercase; color:var(--linen-mute);
}
.card .eyebrow b{ font-weight:700; color:var(--pigment, var(--linen)); }

.card h1{
  margin:.2rem 0 0;
  font-size:clamp(2.5rem, 11vw, 5.5rem); font-weight:700;
  letter-spacing:-.06em; line-height:.92;
}
.card .score{
  font-size:clamp(3rem, 16vw, 7rem); font-weight:700;
  letter-spacing:-.07em; line-height:.9; margin:.1rem 0;
  font-variant-numeric:tabular-nums;
}
.card p{
  margin:0; max-width:34ch;
  font-size:.82rem; color:var(--linen-mute); line-height:1.7;
}

.card .go{
  margin-top:1.4rem;
  font-family:var(--mono); font-size:.7rem; font-weight:500;
  letter-spacing:.18em; text-transform:uppercase;
  color:var(--ground); background:var(--linen);
  border:0; border-radius:2px;
  padding:.85rem 1.6rem;
  cursor:pointer;
  transition:transform .12s ease;
}
.card .go:hover{ transform:translateY(-1px); }
.card .go:focus-visible{ outline:2px solid var(--linen); outline-offset:3px; }
.card .go:active{ transform:translateY(0); }

.card .keys{
  margin-top:.7rem; margin-left:2em; font-size:.62rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--linen-mute); opacity:.55;
}

/* Palette swatch row on the title card — the five pigments you're
   about to face, introduced before you meet them. */
.swatches{ display:flex; gap:.4rem; margin-top:1.5rem; }
.swatches i{ width:1.6rem; height:.28rem; border-radius:1px; display:block; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>

<body>

<main class="board idle" id="board">
  <canvas id="paint" aria-hidden="true"></canvas>

  <div class="hud" id="hud">
    <div class="stat">
      <span class="label">Time clean</span>
      <span class="value" id="time">0.0</span>
    </div>
    <div class="stat right">
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
      <span class="sub" id="best"></span>
    </div>
  </div>

  <div class="gauge" id="gauge">
    <div class="glabel"><span id="inkLabel">Paint</span><span id="inkPct">100</span></div>
    <div class="track"><i class="fill" id="inkFill"></i></div>
  </div>

  <div class="card" id="card">
    <div id="cardBody"></div>
  </div>
</main>

<script>
/* ─────────────────────────────────────────────────────────────
   Paint Drops — dodge and defend.

   Drops of paint land on the canvas at a quickening pace, bounce
   off the edges, and never dry up on their own — left alone, the
   board only fills up. Touch one with your dot and you're caught.
   Hold space (or just drag, on touch) to lay a line of wet paint
   behind your dot; any live drop that touches it while it's still
   wet is wiped from the board. That's the only way drops go away.

   Structure
     1.  constants + state
     2.  size()        — DPR-aware canvas
     3.  spawn()       — one drop, telegraphed before it goes live
     4.  update()      — physics, wall collision, elimination
     5.  draw()        — render pass
     6.  states        — attract / ready / playing / paused / caught
     7.  listeners     — pointer, keyboard, lifecycle
   ───────────────────────────────────────────────────────────── */
(function(){
  'use strict';

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const board       = document.getElementById('board');
  const canvas      = document.getElementById('paint');
  const ctx         = canvas.getContext('2d');
  const hud         = document.getElementById('hud');
  const elTime      = document.getElementById('time');
  const elScore     = document.getElementById('score');
  const elBest      = document.getElementById('best');
  const gauge       = document.getElementById('gauge');
  const inkFill     = document.getElementById('inkFill');
  const inkPct      = document.getElementById('inkPct');
  const inkLabel    = document.getElementById('inkLabel');
  const card        = document.getElementById('card');
  const cardBody    = document.getElementById('cardBody');

  /* Pigments carry their name so the death card can say which colour
     got you — small thing, but it gives each run a story. */
  const PIGMENTS = [
    { name:'ultramarine',    rgb:[ 68, 99,214] },
    { name:'cadmium orange', rgb:[226,101, 42] },
    { name:'viridian',       rgb:[ 46,156,134] },
    { name:'naples yellow',  rgb:[232,178, 74] },
    { name:'alizarin',       rgb:[178, 58, 72] }
  ];
  const rgba = (c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';

  // ── Tuning knobs ──────────────────────────────────────────
  const PLAYER_R  = 6;      // collision radius of the linen dot
  const ARRIVE_MS = 900;    // telegraph window: visible but harmless
  const MAX_DROPS_BASE  = reduced ? 34 : 60;    // concurrent-ball cap at the start of a run
  const MAX_DROPS_PEAK  = reduced ? 56 : 110;   // concurrent-ball cap once density has fully ramped
  const DENSITY_RAMP_MS = 180000;               // time taken to climb from base to peak density
  const SPAWN_MIN = 380;    // fastest spawn cadence, ms
  const SPAWN_MAX = 1250;   // opening spawn cadence, ms
  const RAMP_MS   = 75000;  // time taken to reach full spawn speed
  const SAFE_R    = 150;    // no drop may arrive closer than this to you

  // Painted wall — hold space (drag, on touch) to lay a line of wet
  // paint behind your dot. Paint is not lethal the instant it lands:
  // it has to set. Once a point ARMS it wipes any drop that touches
  // it — and it will just as happily wipe you. Your own line is a
  // hazard, so every stroke needs an exit planned before you lay it.
  const TRAIL_MIN_DIST = 9;      // px of movement before a new stroke point is laid
  const TRAIL_LIFE_MS  = 4000;   // total time a wall stays on the board
  const TRAIL_ARM_MS   = 600;    // harmless while setting; lethal to everything after
  const TRAIL_SOLID_MS = 3000;   // full strength for this long, then eases out over the rest
  const TRAIL_WIDTH    = 7;      // stroke thickness, px
  const TRAIL_MAX_PTS  = 480;    // hard cap so a long session can't grow this unbounded
  const ARM_CLEAR      = 4;      // px of daylight needed before a point is allowed to arm

  // Paint supply — the pot is finite. Painting drains it; it only
  // refills while you are not painting, and after a short beat so
  // that tapping the key can't be used to dodge the drain. Run it
  // dry and you are locked out until it has recovered to INK_UNLOCK.
  const INK_MAX          = 100;
  const INK_DRAIN        = 30;   // units per second while laying paint
  const INK_REGEN        = 6.5;  // units per second while the brush is up
  const INK_REGEN_DELAY  = 700;  // ms of not painting before refilling starts
  const INK_UNLOCK       = 30;   // must climb back to this before painting resumes

  // Kills pay for themselves. Wiping a drop returns paint, and a run
  // of drops taken by ONE continuous stroke pays progressively more —
  // so the long, planned cut through three drifting drops is worth
  // committing to, and hunting is a live alternative to retreating.
  const INK_KILL_BASE  = 12;     // refund for the first drop a stroke takes
  const INK_KILL_STEP  = 8;      // extra refund per additional drop on the same stroke
  const INK_KILL_CAP   = 34;     // ceiling, so a lucky sweep can't top the pot off forever
  const SCORE_PER_DROP = 100;    // k-th drop on a stroke scores SCORE_PER_DROP * k

  // ── State ─────────────────────────────────────────────────
  let w=0, h=0, dpr=1;
  let drops = [];
  let state = 'attract';                    // attract | ready | playing | paused | caught
  let player = { x:0, y:0, seen:false };
  let elapsed = 0, eliminated = 0, score = 0, best = 0;
  /* Combo run, keyed on strokeId. That is only safe because nothing
     reassigns a point's strokeId after it is laid — if anything ever
     splits or renumbers a live stroke again, combos must key on a
     separate birth id instead, or a split will silently reset a run
     mid-sweep. */
  let comboStroke = -1, comboCount = 0;
  let flyers = [];
  let spawnClock = 0, readyClock = 0, pigment = 0;
  let shake = 0, splat = null, lastFrame = 0;
  let trail = [], trailPigment = 0, trailClock = 0, strokeId = 0;
  let spaceDown = false, touchDown = false;
  let ink = INK_MAX, inkDry = false, inkIdle = 0;
  let pops = [];

  /* Are we actually laying paint this frame? Mouse paints only while
     space is held; touch paints while a finger is down. Either way an
     empty pot means nothing comes out. */
  function painting(){ return (spaceDown || touchDown) && !inkDry && ink > 0; }

  /* ── Sizing ───────────────────────────────────────────────
     Backing store = CSS size x DPR (capped at 2), plus a transform so
     all game maths stays in plain CSS pixels. */
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = board.getBoundingClientRect();
    w = r.width; h = r.height;
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!player.seen){ player.x = w/2; player.y = h/2; }
  }
  size();

  let rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      size();
      // Pull any drop that ended up outside the new bounds back in.
      for (const d of drops){
        d.x = Math.min(Math.max(d.x, d.r), Math.max(d.r, w - d.r));
        d.y = Math.min(Math.max(d.y, d.r), Math.max(d.r, h - d.r));
      }
    }, 150);
  });

  /* Difficulty curve, 0 -> 1 over RAMP_MS. Everything that gets
     harder reads from this one value. */
  function ramp(){ return Math.min(elapsed / RAMP_MS, 1); }

  /* Density curve, 0 -> 1 over DENSITY_RAMP_MS — deliberately slower
     than the spawn-speed ramp above, so the concurrent-ball cap keeps
     climbing for a while even after spawn cadence has already hit its
     floor, then levels off at MAX_DROPS_PEAK. */
  function density(){ return Math.min(elapsed / DENSITY_RAMP_MS, 1); }
  function maxDrops(){ return Math.round(MAX_DROPS_BASE + (MAX_DROPS_PEAK - MAX_DROPS_BASE) * density()); }

  /* ── Spawn ────────────────────────────────────────────────
     Places one drop at least SAFE_R away from the player, moving in a
     random direction. It starts in the 'arriving' phase: visible,
     ringed and harmless, so you are never killed by something that
     materialised on top of you. If the board is already at capacity,
     spawning simply pauses until you clear some room — drops never
     get silently culled to make space. */
  function spawn(opts){
    const decor = !!(opts && opts.decor);     // attract-mode drop: never lethal
    if (drops.length >= maxDrops()) return;

    let x, y, tries = 0;
    do {
      x = 40 + Math.random() * Math.max(1, w - 80);
      y = 40 + Math.random() * Math.max(1, h - 80);
      tries++;
    } while (!decor && tries < 24 && Math.hypot(x - player.x, y - player.y) < SAFE_R);

    pigment = (pigment + 1 + Math.floor(Math.random() * 2)) % PIGMENTS.length;
    const p = PIGMENTS[pigment];
    const ang = Math.random() * Math.PI * 2;
    const spd = (decor ? 0.5 : 1.15 + ramp() * 1.7) * (0.7 + Math.random() * 0.6);

    drops.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: decor ? 4 + Math.random() * 7 : 9 + Math.random() * 7,
      color: p.rgb, name: p.name,
      age: 0, decor
    });
  }

  const isLethal = d => !d.decor && d.age >= ARRIVE_MS;

  /* Closest-point-on-segment test against the drop's centre — true if
     the drop is currently overlapping this piece of painted wall. */
  function wallTouch(d, x1, y1, x2, y2, halfW, radius){
    const rr = (radius === undefined) ? d.r : radius;
    const ex = x2 - x1, ey = y2 - y1;
    const len2 = ex*ex + ey*ey || 1;
    let t = ((d.x - x1) * ex + (d.y - y1) * ey) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + ex * t, cy = y1 + ey * t;
    return Math.hypot(d.x - cx, d.y - cy) < rr + halfW;
  }

  /* A drop was just wiped. Work out where it sits in the current
     stroke's run, pay out score and paint accordingly, flash the HUD,
     and leave a burst plus a floating figure so the reward is legible
     at the moment and place it was earned. */
  function eliminate(d, i, lineage){
    drops.splice(i, 1);
    eliminated++;

    // Same line as the last kill? The run continues. Otherwise it's
    // the start of a new one.
    if (lineage === comboStroke) comboCount++;
    else { comboStroke = lineage; comboCount = 1; }

    const gained = SCORE_PER_DROP * comboCount;
    score += gained;
    elScore.textContent = score;

    // Refund paint — this is what makes a kill an investment rather
    // than a consolation. A big enough refund can break a dry lockout,
    // so running the pot down chasing a combo is a real gamble.
    const refund = Math.min(INK_KILL_BASE + INK_KILL_STEP * (comboCount - 1), INK_KILL_CAP);
    ink = Math.min(INK_MAX, ink + refund);
    if (inkDry && ink >= INK_UNLOCK) inkDry = false;

    elTime.style.color = rgba(d.color, 1);
    elTime.classList.remove('flash');
    void elTime.offsetWidth;                  // force the animation to restart
    elTime.classList.add('flash');
    setTimeout(function(){ elTime.style.color = ''; }, 320);

    elScore.classList.remove('flash');
    void elScore.offsetWidth;
    elScore.classList.add('flash');

    // Floating figure: plain points for a single, points plus the
    // multiplier once a run is actually going.
    flyers.push({
      x: d.x, y: d.y, color: d.color, age: 0,
      text: '+' + gained + (comboCount > 1 ? '  \u00d7' + comboCount : ''),
      big: comboCount > 1
    });

    const blobs = [];
    for (let k = 0; k < 6; k++){
      const a  = Math.random() * Math.PI * 2;
      const dd = Math.random() * 20;
      blobs.push({ dx: Math.cos(a)*dd, dy: Math.sin(a)*dd, r: 3 + Math.random()*8 });
    }
    pops.push({ x:d.x, y:d.y, color:d.color, blobs, age:0 });
  }

  /* ── Update ───────────────────────────────────────────────
     dt is normalised to 60fps so the game runs at the same speed on a
     60Hz and a 144Hz display, and delta is clamped so a backgrounded
     tab cannot teleport everything across the board on return. */
  function update(delta){
    const dt = Math.min(delta / 16.667, 3);
    if (state === 'playing') elapsed += delta;

    // Spawn on a clock, not on pointer movement — standing still must
    // never be a way to stop the board filling up.
    if (state === 'playing' || state === 'attract'){
      spawnClock -= delta;
      if (spawnClock <= 0){
        if (state === 'attract'){ spawn({ decor:true }); spawnClock = 900; }
        else { spawn(); spawnClock = SPAWN_MAX - (SPAWN_MAX - SPAWN_MIN) * ramp(); }
      }
    }

    if (state === 'ready'){
      readyClock -= delta;
      if (readyClock <= 0) setState('playing');
    }

    // Painted wall: age every point and drop the ones that have fully
    // faded. Points are appended oldest-first, so the front always
    // dries first — no need to scan the whole array.
    /* Arming: a point goes live once it has had TRAIL_ARM_MS to set
       AND you are standing clear of it. The second condition is what
       stops the game killing you for painting under your own feet —
       paint you are still touching simply waits, and arms the moment
       you step off it. Once armed, a point stays armed for good. */
    for (const p of trail){
      p.age += delta;
      if (!p.armed && p.age >= TRAIL_ARM_MS &&
          Math.hypot(player.x - p.x, player.y - p.y) > PLAYER_R + TRAIL_WIDTH/2 + ARM_CLEAR){
        p.armed = true;
      }
    }
    while (trail.length && trail[0].age > TRAIL_LIFE_MS) trail.shift();

    // Paint supply: drains while the brush is down, refills only after
    // a beat with it up. Empty locks you out until INK_UNLOCK.
    if (state === 'playing'){
      if (painting()){
        inkIdle = 0;
        ink -= INK_DRAIN * delta / 1000;
        if (ink <= 0){ ink = 0; inkDry = true; }
      } else {
        inkIdle += delta;
        if (inkIdle >= INK_REGEN_DELAY){
          ink = Math.min(INK_MAX, ink + INK_REGEN * delta / 1000);
          if (inkDry && ink >= INK_UNLOCK) inkDry = false;
        }
      }
    }

    /* Your own set paint is as lethal to you as it is to the drops.
       Same segment test as the drops use, against your dot. */
    if (state === 'playing'){
      for (let s = 1; s < trail.length; s++){
        const p1 = trail[s], p0 = trail[s - 1];
        if (p0.strokeId !== p1.strokeId || !p0.armed || !p1.armed) continue;
        if (wallTouch(player, p0.x, p0.y, p1.x, p1.y, TRAIL_WIDTH / 2, PLAYER_R)){
          caught({ x:player.x, y:player.y, color:p1.color, name:'your own paint' });
          return;
        }
      }
    }

    if (state === 'playing'){
      trailClock -= delta;
      if (trailClock <= 0){
        trailPigment = (trailPigment + 1 + Math.floor(Math.random() * 2)) % PIGMENTS.length;
        trailClock = 420 + Math.random() * 260;
      }
    }

    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      d.age += delta;

      // Arriving drops hold still; they only start travelling once live.
      if (d.age >= ARRIVE_MS || d.decor){
        d.x += d.vx * dt;
        d.y += d.vy * dt;
      }

      // Bounce at the drop's edge, and clamp so a drop can't get stuck
      // vibrating just outside the boundary.
      if (d.x < d.r){ d.x = d.r; d.vx = Math.abs(d.vx); }
      else if (d.x > w - d.r){ d.x = w - d.r; d.vx = -Math.abs(d.vx); }
      if (d.y < d.r){ d.y = d.r; d.vy = Math.abs(d.vy); }
      else if (d.y > h - d.r){ d.y = h - d.r; d.vy = -Math.abs(d.vy); }

      if (state !== 'playing' || !isLethal(d)) continue;

      // A live drop touching set paint is wiped from the board, and
      // the line comes through it undamaged — one stroke can take any
      // number of drops along its length. Segments only connect within
      // the same stroke, so a gap left by releasing space (or lifting
      // a finger) never draws — or kills — across it.
      let wiped = false, wipedBy = -1;
      for (let s = 1; s < trail.length; s++){
        const p1 = trail[s], p0 = trail[s - 1];
        if (p0.strokeId !== p1.strokeId || !p0.armed || !p1.armed) continue;
        if (wallTouch(d, p0.x, p0.y, p1.x, p1.y, TRAIL_WIDTH / 2)){
          wiped = true; wipedBy = p1.strokeId; break;
        }
      }
      if (wiped){ eliminate(d, i, wipedBy); continue; }

      /* Proper circular collision: centre distance against summed
         radii, squared on both sides to skip the sqrt. */
      const dx = d.x - player.x, dy = d.y - player.y;
      const distSq = dx*dx + dy*dy;
      const hitR = d.r + PLAYER_R;
      if (distSq < hitR * hitR){ caught(d); return; }
    }

    for (let i = flyers.length - 1; i >= 0; i--){
      flyers[i].age += delta;
      if (flyers[i].age > 900) flyers.splice(i, 1);
    }

    for (let i = pops.length - 1; i >= 0; i--){
      pops[i].age += delta;
      if (pops[i].age > 280) pops.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - delta);
    if (splat) splat.age += delta;
  }

  /* ── Draw ─────────────────────────────────────────────── */
  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (shake > 0 && !reduced){
      const k = shake / 320;
      ctx.translate((Math.random()-.5) * 14 * k, (Math.random()-.5) * 14 * k);
    }
    ctx.clearRect(-20, -20, w + 40, h + 40);

    // Painted wall: solid and bright while freshly laid, then thins
    // into a fading afterimage as it approaches the end of its life.
    // It stays lethal to drops for its entire visible lifetime.
    if (trail.length > 1){
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 1; i < trail.length; i++){
        const p0 = trail[i - 1], p1 = trail[i];
        if (p0.strokeId !== p1.strokeId) continue;
        const armed = p0.armed && p1.armed;
        const solid = p1.age < TRAIL_SOLID_MS;
        let a = solid ? 0.7
          : 0.7 * Math.max(0, (TRAIL_LIFE_MS - p1.age) / (TRAIL_LIFE_MS - TRAIL_SOLID_MS));
        // Still setting: thin and faint, so "harmless" and "lethal"
        // are told apart at a glance mid-dodge.
        if (!armed) a *= 0.4;
        if (a <= 0.01) continue;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = rgba(p1.color, a);
        ctx.lineWidth = !armed ? TRAIL_WIDTH * 0.45
                      : solid  ? TRAIL_WIDTH
                               : TRAIL_WIDTH * 0.6;
        ctx.stroke();
      }
    }

    for (const d of drops){
      const arriving = !d.decor && d.age < ARRIVE_MS;

      let a = 0.62;
      if (arriving) a = 0.62 * (d.age / ARRIVE_MS);            // fade in
      if (d.decor) a *= 0.5;
      if (state === 'caught') a *= 0.55;                       // veil the board on death

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = rgba(d.color, a);
      ctx.fill();

      /* Telegraph ring: contracts onto the drop over ARRIVE_MS. The
         moment it lands, the drop is live. The animation IS the
         warning — no invisible grace period. */
      if (arriving){
        const t = d.age / ARRIVE_MS;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r + (1 - t) * 34, 0, Math.PI*2);
        ctx.strokeStyle = rgba(d.color, 0.5 * (1 - t) + 0.15);
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    /* Elimination pops: a quick little burst where a drop was just
       wiped by the wall, so the kill reads clearly frame to frame. */
    for (const p of pops){
      const t = Math.min(p.age / 280, 1);
      const e = 1 - Math.pow(1 - t, 3);
      const a = 0.75 * (1 - t);
      if (a <= 0.01) continue;
      for (const b of p.blobs){
        ctx.beginPath();
        ctx.arc(p.x + b.dx * e, p.y + b.dy * e, Math.max(0, b.r * (1 - e * 0.5)), 0, Math.PI*2);
        ctx.fillStyle = rgba(p.color, a);
        ctx.fill();
      }
    }

    /* Floating payout: rises and fades from where the drop died, so
       the reward reads at the place it was earned rather than only in
       the corner of the screen. Combo hits are larger and brighter. */
    for (const f of flyers){
      const t = Math.min(f.age / 900, 1);
      const a = 1 - Math.pow(t, 2);
      if (a <= 0.01) continue;
      ctx.save();
      ctx.font = (f.big ? '600 20px ' : '500 14px ') +
                 'ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = f.big ? rgba(f.color, a) : 'rgba(239,234,224,' + (a * 0.75) + ')';
      ctx.fillText(f.text, f.x, f.y - 14 - t * 30);
      ctx.restore();
    }

    /* The splatter that got you: overlapping circles scaled in fast.
       This is the one loud moment in the whole design. */
    if (splat){
      const t = Math.min(splat.age / 300, 1);
      const e = 1 - Math.pow(1 - t, 3);
      for (const b of splat.blobs){
        ctx.beginPath();
        ctx.arc(splat.x + b.dx * e, splat.y + b.dy * e, b.r * e, 0, Math.PI*2);
        ctx.fillStyle = rgba(splat.color, 0.8);
        ctx.fill();
      }
    }

    // The player: a linen dot with a thin ring, so it stays findable
    // against five saturated pigments.
    if (state === 'playing' || state === 'ready'){
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_R, 0, Math.PI*2);
      ctx.fillStyle = '#EFEAE0';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(player.x, player.y, PLAYER_R + 5, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(239,234,224,.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Ready beat: a shrinking halo counts you in.
      if (state === 'ready'){
        const t = Math.max(readyClock, 0) / 1100;
        ctx.beginPath();
        ctx.arc(player.x, player.y, PLAYER_R + 6 + t * 60, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(239,234,224,' + (0.5 * (1-t)) + ')';
        ctx.stroke();
      }
    }
  }

  function loop(now){
    const delta = Math.min(now - lastFrame || 16, 50);
    lastFrame = now;
    update(delta);
    draw();
    if (state === 'playing'){
      elTime.textContent = (elapsed/1000).toFixed(1);
      const pct = Math.round(ink);
      inkFill.style.width = pct + '%';
      inkFill.style.background = inkDry
        ? 'rgba(239,234,224,.28)'
        : rgba(PIGMENTS[trailPigment].rgb, 0.9);
      inkPct.textContent = pct;
      inkLabel.textContent = inkDry ? 'Out of paint' : 'Paint';
      gauge.classList.toggle('dry', inkDry);
    }
    requestAnimationFrame(loop);
  }

  /* ── States ───────────────────────────────────────────── */
  function setState(next){
    state = next;
    const active = (next === 'playing' || next === 'ready');
    board.classList.toggle('idle', !active);
    hud.classList.toggle('live', active || next === 'paused');
    gauge.classList.toggle('live', active || next === 'paused');
    card.hidden = active;
  }

  function bindGo(fn){
    const b = document.getElementById('go');
    if (b) b.addEventListener('click', fn);
  }

  function showTitle(){
    setState('attract');
    cardBody.innerHTML =
      '<span class="eyebrow">A dodging game</span>' +
      '<h1>Paint Drops</h1>' +
      '<p>Paint keeps landing on the canvas and never dries on its own \u2014 it only piles up. Hold space (or hold a finger down, on touch) to lay a line behind your dot. It takes a moment to set; once it does, it wipes any drop that touches it \u2014 and it will wipe you just as fast.</p>' +
      '<p>Every wipe pays paint back into the pot, and a run of drops taken by one unbroken line pays more with each drop it catches. Sweep three at once and the line has more than paid for itself.</p>' +
      '<button class="go" id="go">Start painting</button>' +
      '<span class="keys">Or press space</span>' +
      '<span class="swatches">' + PIGMENTS.map(p=>'<i style="background:'+rgba(p.rgb,.9)+'"></i>').join('') + '</span>';
    bindGo(start);
  }

  function start(){
    drops = []; splat = null; shake = 0; pops = []; flyers = [];
    trail = []; trailPigment = Math.floor(Math.random() * PIGMENTS.length); trailClock = 500;
    strokeId = 0; spaceDown = false; touchDown = false;
    ink = INK_MAX; inkDry = false; inkIdle = 0;
    inkFill.style.width = '100%';
    inkPct.textContent = '100';
    inkLabel.textContent = 'Paint';
    gauge.classList.remove('dry');
    elapsed = 0; eliminated = 0; score = 0; spawnClock = 600; readyClock = 1100;
    comboStroke = -1; comboCount = 0;
    elTime.textContent = '0.0';
    elScore.textContent = '0';
    setState('ready');
  }

  function caught(d){
    setState('caught');
    shake = reduced ? 0 : 320;
    spaceDown = false; touchDown = false;

    // Build an irregular splatter around the impact point.
    const blobs = [];
    for (let i = 0; i < 9; i++){
      const a  = Math.random() * Math.PI * 2;
      const dd = Math.random() * 46;
      blobs.push({ dx: Math.cos(a)*dd, dy: Math.sin(a)*dd, r: 6 + Math.random()*22 });
    }
    splat = { x:d.x, y:d.y, color:d.color, blobs, age:0 };

    const secs = elapsed / 1000;
    const isBest = score > best;
    if (isBest) best = score;
    elBest.textContent = 'best ' + best;

    cardBody.innerHTML =
      '<span class="eyebrow" style="--pigment:'+rgba(d.color,1)+'">Caught by <b>'+d.name+'</b></span>' +
      '<span class="score">' + score + '<span style="font-size:.28em;letter-spacing:0"> pts</span></span>' +
      '<p>' + secs.toFixed(1) + 's survived \u00b7 ' + eliminated + ' ball' + (eliminated === 1 ? '' : 's') + ' wiped' +
        (isBest ? ' \u00b7 new best' : ' \u00b7 best ' + best) + '</p>' +
      '<button class="go" id="go">Paint again</button>' +
      '<span class="keys">Or press space</span>';
    bindGo(start);
    setTimeout(function(){ const b = document.getElementById('go'); if (b) b.focus(); }, 60);
  }

  function pause(){
    if (state !== 'playing') return;
    setState('paused');
    spaceDown = false; touchDown = false;
    cardBody.innerHTML =
      '<span class="eyebrow">Paused</span>' +
      '<h1>' + (elapsed/1000).toFixed(1) + 's</h1>' +
      '<p>The board is frozen. Move the pointer to carry on.</p>' +
      '<button class="go" id="go">Resume</button>';
    bindGo(resume);
  }
  function resume(){ if (state === 'paused') setState('playing'); }

  /* ── Listeners ────────────────────────────────────────── */
  board.addEventListener('pointerdown', function(e){
    // A new touch/pen contact always starts a fresh stroke, so a wall
    // never bridges the gap between two separate drags.
    if (e.pointerType !== 'mouse'){ strokeId++; touchDown = true; }
  }, { passive:true });

  // A finger lifting is the touch equivalent of releasing space: the
  // brush comes up, the drain stops and the pot starts refilling.
  ['pointerup','pointercancel'].forEach(function(ev){
    // Window-level: a finger can be lifted past the edge of the board,
    // and that must still put the brush down.
    window.addEventListener(ev, function(e){
      if (e.pointerType !== 'mouse') touchDown = false;
    }, { passive:true });
  });

  /* Bound to the window, not the board, so the dot keeps tracking a
     pointer that has wandered off the playfield. Coordinates are
     clamped to the board so the dot pins itself to the nearest edge
     and stays fully on screen — running for the border is no longer
     an escape, it just backs you into a wall you can't retreat past. */
  window.addEventListener('pointermove', function(e){
    const r = canvas.getBoundingClientRect();
    const px = e.clientX - r.left;
    const py = e.clientY - r.top;
    player.x = Math.min(Math.max(px, PLAYER_R), Math.max(PLAYER_R, w - PLAYER_R));
    player.y = Math.min(Math.max(py, PLAYER_R), Math.max(PLAYER_R, h - PLAYER_R));
    player.seen = true;
    if (state === 'paused') resume();

    if (state === 'playing'){
      // Mouse: only paints while space is held. Touch has no spacebar
      // to hold, so a finger down paints directly instead — matching
      // how a finger naturally "draws". Both are metered by painting(),
      // so an empty pot stops the brush either way.
      if (painting()){
        const last = trail[trail.length - 1];
        if (!last || last.strokeId !== strokeId || Math.hypot(player.x - last.x, player.y - last.y) >= TRAIL_MIN_DIST){
          trail.push({ x: player.x, y: player.y, age: 0, color: PIGMENTS[trailPigment].rgb,
                       armed:false, strokeId });
          if (trail.length > TRAIL_MAX_PTS) trail.shift();
        }
      }
    }
  }, { passive:true });

  // Leaving the board is not a pause and not invincibility — the run
  // carries on with the dot pinned to the edge. Only genuinely losing
  // the page (tab switch, window blur) stops the clock, since the game
  // can't read the pointer at all once that happens.
  window.addEventListener('blur', pause);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) pause(); });

  window.addEventListener('keydown', function(e){
    if (e.code === 'Space'){
      e.preventDefault();                  // never let space scroll the page
      if (e.repeat) return;                // held keys must not repeat-trigger start() or new strokes
      if (state === 'attract' || state === 'caught'){ start(); return; }
      if ((state === 'playing' || state === 'ready') && !spaceDown){
        spaceDown = true;
        strokeId++;                        // begin a fresh stroke each time space goes down
      }
      return;
    }
    if (e.code === 'Enter'){
      if (e.repeat) return;
      if (state === 'attract' || state === 'caught'){ e.preventDefault(); start(); }
      return;
    }
    if (e.code === 'Escape'){
      pause();
      /* Embedded in a page? Escape belongs to the host — a keydown in
         an iframe never reaches the parent document, so hand it over
         explicitly and let the host decide what to close. */
      if (window.parent !== window){
        try { window.parent.postMessage('wetpaint:close', '*'); } catch(_){}
      }
    }
  });

  window.addEventListener('keyup', function(e){
    if (e.code === 'Space') spaceDown = false;
  });

  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
